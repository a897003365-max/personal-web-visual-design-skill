<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MDS 字体与层级样张</title><style>:root{color-scheme:light dark}body{margin:0;padding:24px;background:light-dark(#fff,#111113)}</style></head><body>
<link rel="stylesheet" href="./fonts/noto-sans-sc/index.css">
<link rel="stylesheet" href="./fonts/barlow-semi-condensed/500.css">
<link rel="stylesheet" href="./fonts/barlow-semi-condensed/600.css">
<link rel="stylesheet" href="./fonts/barlow-semi-condensed/700.css">
<style>
  #mds-commerce-type {
    --mds-bg: light-dark(#f9f9fb, #111113);
    --mds-panel: light-dark(#ffffff, #18191b);
    --mds-ink: light-dark(#1c2024, #edeef0);
    --mds-secondary: light-dark(#60646c, #b0b4ba);
    --mds-line: light-dark(#d9d9e0, #363a3f);
    --mds-soft: light-dark(#f0f0f3, #212225);
    --mds-good: light-dark(#008573, #0bd8b6);
    --mds-bad: light-dark(#d13415, #ff977d);
    --mds-highlight: light-dark(#e0f8f3, #0d2d2a);
    --mds-highlight-ink: light-dark(#0d3d38, #adf0dd);
    --mds-primary-size: 46px;
    --mds-row-space: 14px;
    --mds-title-weight: 700;
    width: 100%; max-width: 736px; margin-inline: auto;
    container: merchant-type / inline-size;
    color: var(--mds-ink);
    font-family: "Noto Sans SC Variable", sans-serif;
  }
  #mds-commerce-type * { box-sizing: border-box; }
  #mds-commerce-type .preview-caption { margin: 0 0 12px; padding-right: 90px; min-height: 40px; font-size: 12px; line-height: 1.7; color: var(--mds-secondary); }
  #mds-commerce-type .merchant-stage { padding: 12px; }
  #mds-commerce-type .merchant-window { background: var(--mds-bg); border: 1px solid var(--mds-line); border-radius: 12px; overflow: hidden; }
  #mds-commerce-type .merchant-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 24px; padding: 22px 24px 18px; background: var(--mds-panel); border-bottom: 1px solid var(--mds-line); }
  #mds-commerce-type .merchant-head h2 { margin: 0; font-size: 24px; line-height: 1.4; letter-spacing: 0; font-weight: var(--mds-title-weight); }
  #mds-commerce-type .merchant-scope { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; font-weight: 500; color: var(--mds-secondary); }
  #mds-commerce-type .merchant-scope b { font-weight: 600; color: var(--mds-ink); }
  #mds-commerce-type .merchant-content { padding: 20px 24px 24px; }
  #mds-commerce-type .metric-grid { display: grid; grid-template-columns: 1.65fr 1fr 1fr; gap: 12px; }
  #mds-commerce-type .metric { min-width: 0; padding: 18px 16px 16px; background: var(--mds-panel); border-radius: 8px; }
  #mds-commerce-type .metric.primary { background: var(--mds-highlight); color: var(--mds-highlight-ink); }
  #mds-commerce-type .metric-label { font-size: 14px; line-height: 1.5; font-weight: 600; }
  #mds-commerce-type .value-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
  #mds-commerce-type .digits { font-family: "Barlow Semi Condensed", sans-serif; font-variant-numeric: tabular-nums lining-nums; letter-spacing: 0; }
  #mds-commerce-type .metric-value { font-size: 36px; line-height: 1.05; font-weight: 600; }
  #mds-commerce-type .primary .metric-value { font-size: var(--mds-primary-size); font-weight: 700; }
  #mds-commerce-type .metric-unit { font-size: 13px; font-weight: 500; }
  #mds-commerce-type .metric-change { margin-top: 14px; font-size: 12px; line-height: 1.6; font-weight: 500; }
  #mds-commerce-type .primary .metric-change { color: var(--mds-highlight-ink); }
  #mds-commerce-type .good { color: var(--mds-good); }
  #mds-commerce-type .bad { color: var(--mds-bad); }
  #mds-commerce-type .merchant-table { margin-top: 20px; background: var(--mds-panel); border-radius: 8px; overflow: hidden; }
  #mds-commerce-type .table-heading { padding: 16px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  #mds-commerce-type .table-heading h3 { margin: 0; font-size: 16px; line-height: 1.5; font-weight: 600; }
  #mds-commerce-type .table-heading span { font-size: 12px; color: var(--mds-secondary); }
  #mds-commerce-type table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 14px; line-height: 1.5; }
  #mds-commerce-type th { padding: 10px 16px; background: var(--mds-soft); color: var(--mds-secondary); font-size: 12px; font-weight: 600; }
  #mds-commerce-type td { padding: var(--mds-row-space) 16px; border-bottom: 1px solid var(--mds-soft); vertical-align: middle; }
  #mds-commerce-type tr:last-child td { border-bottom: 0; }
  #mds-commerce-type th:first-child, #mds-commerce-type td:first-child { text-align: left; width: 28%; }
  #mds-commerce-type th:nth-child(2), #mds-commerce-type td:nth-child(2) { text-align: right; width: 25%; }
  #mds-commerce-type th:last-child, #mds-commerce-type td:last-child { text-align: right; width: 47%; }
  #mds-commerce-type td:nth-child(2) { font-family: "Barlow Semi Condensed", sans-serif; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #mds-commerce-type td:last-child { font-size: 13px; }
  #mds-commerce-type .change-number { font-family: "Barlow Semi Condensed", sans-serif; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #mds-commerce-type .font-caption { margin: 12px 12px 0; color: var(--mds-secondary); font-size: 12px; line-height: 1.8; overflow-wrap: anywhere; }
  #mds-commerce-type .font-status { display: block; }
  @container merchant-type (max-width: 620px) {
    #mds-commerce-type .metric-grid { grid-template-columns: 1fr 1fr; }
    #mds-commerce-type .metric.primary { grid-column: 1 / -1; }
    #mds-commerce-type .merchant-head { align-items: flex-start; }
    #mds-commerce-type .merchant-scope { margin-left: 0; width: 100%; }
  }
  @container merchant-type (max-width: 400px) {
    #mds-commerce-type .merchant-stage { padding: 0; }
    #mds-commerce-type .merchant-head { padding: 18px 16px 14px; }
    #mds-commerce-type .merchant-head h2 { font-size: 22px; }
    #mds-commerce-type .merchant-content { padding: 16px; }
    #mds-commerce-type .metric { padding: 16px 12px; }
    #mds-commerce-type .metric-grid { gap: 10px; }
    #mds-commerce-type th, #mds-commerce-type td { padding-left: 9px; padding-right: 9px; }
    #mds-commerce-type table { font-size: 13px; }
    #mds-commerce-type td:last-child { font-size: 12px; }
  }
</style>
<section id="mds-commerce-type" aria-label="电商经营看板字体与层级样张">
  <p class="preview-caption">字体与层级样张 · 示例数据</p>
  <div class="merchant-stage viz-dotted-background">
    <div class="merchant-window">
      <header class="merchant-head">
        <h2>经营数据看板</h2>
        <div class="merchant-scope"><b>天猫旗舰店</b><span>·</span><span>近 7 天</span></div>
      </header>
      <div class="merchant-content">
        <div class="metric-grid">
          <article class="metric primary" aria-label="净回款样例">
            <div class="metric-label">净回款</div>
            <div class="value-line"><strong class="metric-value digits">1,234.56</strong><span class="metric-unit">万元</span></div>
            <div class="metric-change good">↑ 较上期提升 <span class="digits">12.8%</span></div>
          </article>
          <article class="metric" aria-label="推广费比样例">
            <div class="metric-label">推广费比</div>
            <div class="value-line"><strong class="metric-value digits">9.18</strong><span class="metric-unit">%</span></div>
            <div class="metric-change good">↓ 下降 <span class="digits">1.25</span> 个百分点</div>
          </article>
          <article class="metric" aria-label="退款率样例">
            <div class="metric-label">退款率</div>
            <div class="value-line"><strong class="metric-value digits">10.20</strong><span class="metric-unit">%</span></div>
            <div class="metric-change bad">↑ 上升 <span class="digits">0.60</span> 个百分点</div>
          </article>
        </div>
        <section class="merchant-table" aria-label="经营明细排版样例">
          <div class="table-heading"><h3>核心经营指标</h3><span>较上一等长周期</span></div>
          <table>
            <thead><tr><th>指标</th><th>本期</th><th>较上期</th></tr></thead>
            <tbody>
              <tr><td>支付转化率</td><td>12.35%</td><td class="good">↑ 提升 <span class="change-number">2.10</span> 个百分点</td></tr>
              <tr><td>推广费比</td><td>9.18%</td><td class="good">↓ 下降 <span class="change-number">1.25</span> 个百分点</td></tr>
              <tr><td>退款率</td><td>10.20%</td><td class="bad">↑ 上升 <span class="change-number">0.60</span> 个百分点</td></tr>
              <tr><td>推广 ROI</td><td>8.56x</td><td class="good">↑ 提升 <span class="change-number">1.20x</span></td></tr>
            </tbody>
          </table>
        </section>
      </div>
    </div>
  </div>
  <p class="font-caption">中文：Noto Sans SC · 数字：Barlow Semi Condensed<span id="mds-commerce-font-status" class="font-status" role="status" aria-live="polite">正在加载字体…</span></p>
</section>
<script>
(() => {
  const root = document.getElementById('mds-commerce-type');
  const fontStatus = root.querySelector('#mds-commerce-font-status');
  const settings = { primarySize: 46, titleWeight: 700, rowSpace: 14 };
  function applyTypeSettings() {
    root.style.setProperty('--mds-primary-size', settings.primarySize + 'px');
    root.style.setProperty('--mds-title-weight', settings.titleWeight);
    root.style.setProperty('--mds-row-space', settings.rowSpace + 'px');
  }
  applyTypeSettings();
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: applyTypeSettings });
    tweak.addSlider(settings, 'primarySize', { label: '主指标字号', min: 38, max: 52, step: 2, unit: 'px' });
    tweak.addSlider(settings, 'titleWeight', { label: '中文标题字重', min: 600, max: 800, step: 100 });
    tweak.addSlider(settings, 'rowSpace', { label: '表格行内间距', min: 10, max: 18, step: 2, unit: 'px' });
  }
  function showFontStatus() {
    const faces = Array.from(document.fonts).filter(face => face.status === 'loaded');
    const chinese = faces.some(face => face.family.includes('Noto Sans SC Variable'));
    const numbers = faces.some(face => face.family.includes('Barlow Semi Condensed'));
    fontStatus.textContent = chinese && numbers ? '两种字体已加载' : '字体尚未完整加载，当前可能显示系统字体';
  }
  document.fonts.ready.then(showFontStatus);
  document.fonts.addEventListener('loadingdone', showFontStatus);
  document.fonts.addEventListener('loadingerror', showFontStatus);
})();
</script>

</body></html>
