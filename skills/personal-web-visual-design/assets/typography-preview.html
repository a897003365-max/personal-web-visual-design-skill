<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人网页字体与层级样张</title><style>:root{color-scheme:light dark}body{margin:0;padding:24px;background:light-dark(#fff,#111113)}</style></head><body>
<link rel="stylesheet" href="./fonts/noto-sans-sc/index.css">
<link rel="stylesheet" href="./fonts/barlow-semi-condensed/500.css">
<link rel="stylesheet" href="./fonts/barlow-semi-condensed/600.css">
<link rel="stylesheet" href="./fonts/barlow-semi-condensed/700.css">
<style>
  #personal-type-preview {
    --pw-bg: light-dark(#f9f9fb, #111113);
    --pw-panel: light-dark(#ffffff, #18191b);
    --pw-ink: light-dark(#1c2024, #edeef0);
    --pw-secondary: light-dark(#60646c, #b0b4ba);
    --pw-line: light-dark(#d9d9e0, #363a3f);
    --pw-soft: light-dark(#f0f0f3, #212225);
    --pw-good: light-dark(#008573, #0bd8b6);
    --pw-bad: light-dark(#d13415, #ff977d);
    --pw-highlight: light-dark(#e0f8f3, #0d2d2a);
    --pw-highlight-ink: light-dark(#0d3d38, #adf0dd);
    --pw-primary-size: 46px;
    --pw-row-space: 14px;
    --pw-title-weight: 700;
    width: 100%; max-width: 736px; margin-inline: auto;
    container: specimen-type / inline-size;
    color: var(--pw-ink);
    font-family: "Noto Sans SC Variable", sans-serif;
  }
  #personal-type-preview * { box-sizing: border-box; }
  #personal-type-preview .preview-caption { margin: 0 0 12px; font-size: 12px; line-height: 1.7; color: var(--pw-secondary); }
  #personal-type-preview .specimen-stage { padding: 12px; }
  #personal-type-preview .specimen-window { background: var(--pw-bg); border: 1px solid var(--pw-line); border-radius: 12px; overflow: hidden; }
  #personal-type-preview .specimen-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 24px; padding: 22px 24px 18px; background: var(--pw-panel); border-bottom: 1px solid var(--pw-line); }
  #personal-type-preview .specimen-head h2 { margin: 0; font-size: 24px; line-height: 1.4; letter-spacing: 0; font-weight: var(--pw-title-weight); }
  #personal-type-preview .specimen-scope { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; font-weight: 500; color: var(--pw-secondary); }
  #personal-type-preview .specimen-scope b { font-weight: 600; color: var(--pw-ink); }
  #personal-type-preview .specimen-content { padding: 20px 24px 24px; }
  #personal-type-preview .metric-grid { display: grid; grid-template-columns: 1.65fr 1fr 1fr; gap: 12px; }
  #personal-type-preview .metric { min-width: 0; padding: 18px 16px 16px; background: var(--pw-panel); border-radius: 8px; }
  #personal-type-preview .metric.primary { background: var(--pw-highlight); color: var(--pw-highlight-ink); }
  #personal-type-preview .metric-label { font-size: 14px; line-height: 1.5; font-weight: 600; }
  #personal-type-preview .value-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
  #personal-type-preview .digits { font-family: "Barlow Semi Condensed", sans-serif; font-variant-numeric: tabular-nums lining-nums; letter-spacing: 0; }
  #personal-type-preview .metric-value { font-size: 36px; line-height: 1.05; font-weight: 600; }
  #personal-type-preview .primary .metric-value { font-size: var(--pw-primary-size); font-weight: 700; }
  #personal-type-preview .metric-unit { font-size: 13px; font-weight: 500; }
  #personal-type-preview .metric-change { margin-top: 14px; font-size: 12px; line-height: 1.6; font-weight: 500; }
  #personal-type-preview .primary .metric-change { color: var(--pw-highlight-ink); }
  #personal-type-preview .good { color: var(--pw-good); }
  #personal-type-preview .bad { color: var(--pw-bad); }
  #personal-type-preview .specimen-table { margin-top: 20px; background: var(--pw-panel); border-radius: 8px; overflow: hidden; }
  #personal-type-preview .table-heading { padding: 16px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  #personal-type-preview .table-heading h3 { margin: 0; font-size: 16px; line-height: 1.5; font-weight: 600; }
  #personal-type-preview .table-heading span { font-size: 12px; color: var(--pw-secondary); }
  #personal-type-preview table { min-width: 520px; width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 14px; line-height: 1.5; }
  #personal-type-preview th { padding: 10px 16px; background: var(--pw-soft); color: var(--pw-secondary); font-size: 12px; font-weight: 600; }
  #personal-type-preview td { padding: var(--pw-row-space) 16px; border-bottom: 1px solid var(--pw-soft); vertical-align: middle; }
  #personal-type-preview tr:last-child td { border-bottom: 0; }
  #personal-type-preview th:first-child, #personal-type-preview td:first-child { text-align: left; width: 28%; }
  #personal-type-preview th:nth-child(2), #personal-type-preview td:nth-child(2) { text-align: right; width: 25%; }
  #personal-type-preview th:last-child, #personal-type-preview td:last-child { text-align: right; width: 47%; }
  #personal-type-preview td:nth-child(2) { font-family: "Barlow Semi Condensed", sans-serif; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #personal-type-preview td:last-child { font-size: 13px; }
  #personal-type-preview .change-number { font-family: "Barlow Semi Condensed", sans-serif; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #personal-type-preview .font-caption { margin: 12px 12px 0; color: var(--pw-secondary); font-size: 12px; line-height: 1.8; overflow-wrap: anywhere; }
  #personal-type-preview .font-status { display: block; }
  #personal-type-preview .table-scroll { overflow-x: auto; }
  #personal-type-preview .table-scroll:focus-visible { outline: 2px solid var(--pw-good); outline-offset: -2px; }
  @container specimen-type (max-width: 620px) {
    #personal-type-preview .metric-grid { grid-template-columns: 1fr 1fr; }
    #personal-type-preview .metric.primary { grid-column: 1 / -1; }
    #personal-type-preview .specimen-head { align-items: flex-start; }
    #personal-type-preview .specimen-scope { margin-left: 0; width: 100%; }
  }
  @container specimen-type (max-width: 400px) {
    #personal-type-preview .specimen-stage { padding: 0; }
    #personal-type-preview .specimen-head { padding: 18px 16px 14px; }
    #personal-type-preview .specimen-head h2 { font-size: 22px; }
    #personal-type-preview .specimen-content { padding: 16px; }
    #personal-type-preview .metric { padding: 16px 12px; }
    #personal-type-preview .metric-grid { gap: 10px; }
    #personal-type-preview th, #personal-type-preview td { padding-left: 12px; padding-right: 12px; }
    #personal-type-preview table { font-size: 13px; }
    #personal-type-preview td:last-child { font-size: 12px; }
  }
</style>
<section id="personal-type-preview" aria-label="网页字体与层级样张">
  <p class="preview-caption">字体与层级样张 · 示例数据</p>
  <div class="specimen-stage">
    <div class="specimen-window">
      <header class="specimen-head">
        <h2>关键数据一览</h2>
        <div class="specimen-scope"><b>示例项目</b><span>·</span><span>近 7 天</span></div>
      </header>
      <div class="specimen-content">
        <div class="metric-grid">
          <article class="metric primary" aria-label="完成量样例">
            <div class="metric-label">完成量</div>
            <div class="value-line"><strong class="metric-value digits">1,234.56</strong><span class="metric-unit">万次</span></div>
            <div class="metric-change good">↑ 较上期提升 <span class="digits">12.8%</span></div>
          </article>
          <article class="metric" aria-label="返工率样例">
            <div class="metric-label">返工率</div>
            <div class="value-line"><strong class="metric-value digits">9.18</strong><span class="metric-unit">%</span></div>
            <div class="metric-change good">↓ 下降 <span class="digits">1.25</span> 个百分点</div>
          </article>
          <article class="metric" aria-label="错误率样例">
            <div class="metric-label">错误率</div>
            <div class="value-line"><strong class="metric-value digits">10.20</strong><span class="metric-unit">%</span></div>
            <div class="metric-change bad">↑ 上升 <span class="digits">0.60</span> 个百分点</div>
          </article>
        </div>
        <section class="specimen-table" aria-label="表格排版样例">
          <div class="table-heading"><h3>主要指标</h3><span>较上一等长周期</span></div>
          <div class="table-scroll" role="region" aria-label="指标表格，可横向滚动" tabindex="0">
          <table>
            <thead><tr><th>指标</th><th>本期</th><th>较上期</th></tr></thead>
            <tbody>
              <tr><td>完成率</td><td>12.35%</td><td class="good">↑ 提升 <span class="change-number">2.10</span> 个百分点</td></tr>
              <tr><td>返工率</td><td>9.18%</td><td class="good">↓ 下降 <span class="change-number">1.25</span> 个百分点</td></tr>
              <tr><td>错误率</td><td>10.20%</td><td class="bad">↑ 上升 <span class="change-number">0.60</span> 个百分点</td></tr>
              <tr><td>效能比</td><td>8.56x</td><td class="good">↑ 提升 <span class="change-number">1.20x</span></td></tr>
            </tbody>
          </table>
          </div>
        </section>
      </div>
    </div>
  </div>
  <p class="font-caption">中文：Noto Sans SC · 数字：Barlow Semi Condensed<span id="personal-font-status" class="font-status" role="status" aria-live="polite">正在加载字体…</span></p>
</section>
<script>
(() => {
  const root = document.getElementById('personal-type-preview');
  const fontStatus = root.querySelector('#personal-font-status');
  function showFontStatus() {
    const faces = Array.from(document.fonts).filter(face => face.status === 'loaded');
    const chinese = faces.some(face => face.family.includes('Noto Sans SC Variable'));
    const numbers = faces.some(face => face.family.includes('Barlow Semi Condensed'));
    fontStatus.textContent = chinese && numbers ? '两种字体已加载' : '字体尚未完整加载，当前可能显示系统字体';
  }
  document.fonts.ready.then(showFontStatus);
  document.fonts.addEventListener('loadingdone', showFontStatus);
  document.fonts.addEventListener('loadingerror', showFontStatus);
})();
</script>

</body></html>
